apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: panaderia-grupo-4
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: panaderia-grupo-4
    team: power-rangers
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: panaderia-grupo-4
        team: power-rangers
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/virtualizacion-proyecto-pr/panaderia-repo/frontend:1.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: panaderia-grupo-4
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: panaderia-grupo-4
    team: power-rangers
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: http-alt
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: frontend
