apiVersion: apps/v1
kind: Deployment
metadata:
  name: productos
  namespace: panaderia-grupo-4
  labels:
    app.kubernetes.io/name: productos
    app.kubernetes.io/part-of: panaderia-grupo-4
    team: power-rangers
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: productos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: productos
        app.kubernetes.io/part-of: panaderia-grupo-4
        team: power-rangers
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: productos
          image: us-central1-docker.pkg.dev/panaderia-grupo-4/panaderia-repo/productos:1.0.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panaderia-secrets
                  key: PRODUCTOS_DATABASE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: panaderia-config
                  key: LOG_LEVEL
            - name: DB_CONNECT_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: panaderia-config
                  key: DB_CONNECT_TIMEOUT_SECONDS
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: productos
  namespace: panaderia-grupo-4
  labels:
    app.kubernetes.io/name: productos
    app.kubernetes.io/part-of: panaderia-grupo-4
    team: power-rangers
spec:
  type: LoadBalancer
  ports:
    - name: http-internal
      port: 8000
      targetPort: 8000
    - name: http-external
      port: 8001
      targetPort: 8000
  selector:
    app.kubernetes.io/name: productos
