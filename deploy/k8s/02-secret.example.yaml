# Plantilla de Secret para Kubernetes
# Copiar este archivo a 02-secret.yaml (ignorado por Git) y reemplazar los valores en base64
# o usar el comando kubectl recomendado:
#
# kubectl create secret generic panaderia-secrets \
#   --namespace panaderia-grupo-4 \
#   --from-literal=POSTGRES_PASSWORD='TU_PASSWORD_ADMIN' \
#   --from-literal=PRODUCTOS_DB_PASSWORD='TU_PASSWORD_PRODUCTOS' \
#   --from-literal=PEDIDOS_DB_PASSWORD='TU_PASSWORD_PEDIDOS' \
#   --from-literal=PRODUCTOS_DATABASE_URL='postgresql+psycopg://productos_app:TU_PASSWORD_PRODUCTOS@postgres.panaderia-grupo-4.svc.cluster.local:5432/productos_db' \
#   --from-literal=PEDIDOS_DATABASE_URL='postgresql+psycopg://pedidos_app:TU_PASSWORD_PEDIDOS@postgres.panaderia-grupo-4.svc.cluster.local:5432/pedidos_db'
#
apiVersion: v1
kind: Secret
metadata:
  name: panaderia-secrets
  namespace: panaderia-grupo-4
  labels:
    app.kubernetes.io/name: panaderia
    app.kubernetes.io/part-of: panaderia-grupo-4
    team: power-rangers
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REEMPLAZAR_CON_PASSWORD_ADMIN"
  PRODUCTOS_DB_PASSWORD: "REEMPLAZAR_CON_PASSWORD_PRODUCTOS"
  PEDIDOS_DB_PASSWORD: "REEMPLAZAR_CON_PASSWORD_PEDIDOS"
  PRODUCTOS_DATABASE_URL: "postgresql+psycopg://productos_app:REEMPLAZAR_CON_PASSWORD_PRODUCTOS@postgres.panaderia-grupo-4.svc.cluster.local:5432/productos_db"
  PEDIDOS_DATABASE_URL: "postgresql+psycopg://pedidos_app:REEMPLAZAR_CON_PASSWORD_PEDIDOS@postgres.panaderia-grupo-4.svc.cluster.local:5432/pedidos_db"
